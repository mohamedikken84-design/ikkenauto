name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: PostgreSQL voor integratietests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          cluster=$(pg_lsclusters --no-header | awk 'NR==1 {print $1, $2, $4}')
          set -- $cluster
          if [ "$3" != "online" ]; then
            sudo pg_ctlcluster "$1" "$2" start
          fi
          sudo -u postgres psql -c "CREATE ROLE ikkenauto LOGIN PASSWORD 'ci_ephemeral_only';" || sudo -u postgres psql -c "ALTER ROLE ikkenauto WITH LOGIN PASSWORD 'ci_ephemeral_only';"
          sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'ikkenauto_test'" | grep -q 1 || sudo -u postgres createdb -O ikkenauto ikkenauto_test
          sudo -u postgres psql -d ikkenauto_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
          sudo -u postgres psql -d ikkenauto_test -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN NOINHERIT; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN NOINHERIT; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS; END IF; END \$\$; GRANT anon, authenticated, service_role TO ikkenauto; GRANT USAGE ON SCHEMA public TO anon, authenticated; GRANT USAGE, CREATE ON SCHEMA public TO service_role;"
      - run: npm run lint
      - run: npm test
        env:
          DATABASE_URL: postgres://ikkenauto:ci_ephemeral_only@127.0.0.1:5432/ikkenauto_test
          AUTH_MODE: development-session
      - run: npm run build
